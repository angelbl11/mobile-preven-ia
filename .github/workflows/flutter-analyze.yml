name: Flutter Build and Analyze

on:
  pull_request:
    branches:
      - develop
      - master

jobs:
  build_and_analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.27.0 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH
        shell: bash

      - run: flutter precache
        shell: bash

      - name: Flutter Build
        run: flutter build

      - name: Flutter Analyze
        run: flutter analyze

  merge-check:
    runs-on: ubuntu-latest

    needs: build_and_analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Check if Flutter Build and Analyze passed
        run: echo "Flutter Build and Analyze Passed"
