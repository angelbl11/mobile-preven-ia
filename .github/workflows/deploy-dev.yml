name: Deploy Flutter App to Firebase App Distribution

on:
  push:
    branches:
      - develop

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Java
        uses: actions/setup-java@v1
        with:
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"

      - name: Clean flutter cache
        run: flutter pub cache clean

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check for outdated dependencies
        run: flutter pub outdated

      - name: Generate build files
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Android
        if: false
        run: flutter build apk --flavor mx --dart-define-from-file=environments/mx/env.json --debug

      - name: Setup Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate with Firebase
        env:
          GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICES_FILE }}
        run: echo $GOOGLE_SERVICE_JSON | base64 -di > google-services.json

      - name: Deploy to Firebase App Distribution MX
        if: false
        run: firebase appdistribution:distribute build/app/outputs/flutter-apk/app-debug.apk --app "1:272889988973:android:81bee3b6a9dc2d3f327c64" --groups "testers" --release-notes-file ./release_notes.txt --token ${{ secrets.FIREBASE_TOKEN }}
